<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Chart.js from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="light">

  <!-- ── Header ─────────────────────────────────────────── -->
  <header class="app-header">
    <h1 class="app-title">💸 Budget Tracker</h1>
    <button id="themeToggle" class="icon-btn" aria-label="Toggle dark/light mode">🌙</button>
  </header>

  <main class="container">

    <!-- ── Balance Card ───────────────────────────────────── -->
    <section class="card balance-card" aria-label="Total balance">
      <p class="balance-label">Total Spent</p>
      <p class="balance-amount" id="totalBalance">$0.00</p>
      <!-- Spend limit -->
      <div class="limit-row">
        <label for="spendLimit" class="limit-label">Spend Limit ($)</label>
        <input type="number" id="spendLimit" class="limit-input" placeholder="e.g. 500" min="0" />
      </div>
      <p class="limit-warning hidden" id="limitWarning">⚠️ You've exceeded your spend limit!</p>
    </section>

    <!-- ── Add Transaction Form ────────────────────────────── -->
    <section class="card" aria-label="Add transaction">
      <h2 class="section-title">Add Transaction</h2>
      <form id="transactionForm" novalidate>
        <div class="form-group">
          <label for="itemName">Item Name</label>
          <input type="text" id="itemName" placeholder="e.g. Lunch" autocomplete="off" />
          <span class="error-msg" id="nameError">Please enter an item name.</span>
        </div>
        <div class="form-group">
          <label for="amount">Amount ($)</label>
          <input type="number" id="amount" placeholder="e.g. 12.50" min="0.01" step="0.01" />
          <span class="error-msg" id="amountError">Please enter a valid amount.</span>
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="">-- Select Category --</option>
            <option value="Food">🍔 Food</option>
            <option value="Transport">🚌 Transport</option>
            <option value="Fun">🎉 Fun</option>
          </select>
          <span class="error-msg" id="categoryError">Please select a category.</span>
        </div>
        <button type="submit" class="btn-primary">Add Transaction</button>
      </form>
    </section>

    <!-- ── Chart ──────────────────────────────────────────── -->
    <section class="card chart-card" aria-label="Spending chart">
      <h2 class="section-title">Spending by Category</h2>
      <div class="chart-wrapper">
        <canvas id="spendingChart" aria-label="Pie chart of spending by category" role="img"></canvas>
        <p class="chart-empty" id="chartEmpty">No transactions yet.</p>
      </div>
    </section>

    <!-- ── Transaction List ───────────────────────────────── -->
    <section class="card" aria-label="Transaction history">
      <h2 class="section-title">Transaction History</h2>
      <ul class="transaction-list" id="transactionList" aria-live="polite">
        <!-- Items injected by JS -->
      </ul>
      <p class="list-empty hidden" id="listEmpty">No transactions yet. Add one above!</p>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
